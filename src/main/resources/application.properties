# PennyWise Database Configuration
# Default target is MySQL 8.x
db.url=jdbc:mysql://localhost:3306/pennywise_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000

# Application Defaults
app.name=PennyWise
app.version=1.0.0
app.default.currency=INR
app.currency.symbol=₹

# Fallback in-memory/embedded H2 mode for offline development and test environments
db.fallback.h2=true

